<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CYNX Folio — Utsav Sachan</title>
  <meta
    name="description"
    content="CYNX Folio — Portfolio of Utsav Sachan. Flutter developer building cross-platform apps with an eye for product design and brand."
  >

  <!-- Open Graph / Facebook / LinkedIn / Discord -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cyanide07x.github.io/cyanide_portfolio/">
  <meta property="og:title" content="CYNX Folio — Utsav Sachan">
  <meta property="og:description" content="Design and code, out of phase on purpose. Cross-platform apps with an eye for product design and brand.">
  <meta property="og:site_name" content="CYNX Folio">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CYNX Folio — Utsav Sachan">
  <meta name="twitter:description" content="Design and code, out of phase on purpose. Cross-platform apps with an eye for product design and brand.">

  <!-- Theme color & iOS meta tags -->
  <meta name="theme-color" content="#0A0508">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CYNX Folio">

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="favicon.svg"
  >

  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background-color: #0A0508;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      transition: opacity 0.4s ease;
    }

    .loading-pulse {
      width: 44px;
      height: 44px;
      border: 2px solid rgba(213, 0, 69, 0.2);
      border-top-color: #D50045;
      border-radius: 50%;
      animation: spin 0.85s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
    }

    .loading-brand {
      color: #9E9699;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="loading" class="loading-container">
    <div class="loading-pulse"></div>
    <div class="loading-brand">CYNX Folio</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.remove();
        }, 400);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
